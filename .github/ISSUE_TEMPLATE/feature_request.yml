name: Feature Request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in Fredie?
      description: >
        Fredie stays small on purpose — quality over quantity. It has already borrowed what it
        wanted from Raycast, so "Raycast has it" is not a reason. Tell us why this is worth its
        weight.
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: Read CONTRIBUTING.md before preparing a change.
      options:
        - label: I'm willing to implement this myself
          required: false
