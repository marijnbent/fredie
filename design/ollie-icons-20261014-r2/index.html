<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--surface:#22252b;--surface-hover:#2a2e35;--ink:#f5f2ec;--quiet:#a6a9ad;--line:#3a3d44;--scene:#12161d;--radius:16px;font-family:var(--font-sans,system-ui,sans-serif)}
html,body{margin:0;background:transparent;color:var(--foreground,var(--ink))}
*{box-sizing:border-box}button{font:inherit;cursor:pointer}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-bottom:12px}
.toolbar button{border:1px solid var(--border,var(--line));border-radius:8px;color:var(--foreground,var(--ink));padding:6px 10px;background:transparent;font-size:12px}
.toolbar button[aria-pressed="true"]{background:var(--secondary,#303239)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);min-width:0}
.art{background:transparent;border:0;border-radius:12px;display:block;width:100%;padding:4px;margin:0 0 13px;transition:background .15s}
.art:hover{background:var(--surface-hover)}
.art:focus-visible,.toolbar button:focus-visible{outline:2px solid #829bd0;outline-offset:3px}
.art img{display:block;width:100%;max-width:168px;aspect-ratio:1;object-fit:contain;margin:auto}
.name{display:flex;gap:8px;align-items:baseline;letter-spacing:-.025em;font-size:15px;font-weight:650}
.letter{color:var(--quiet);font-size:12px;font-weight:500;letter-spacing:0}
.note{margin:6px 0 0;font-size:12px;line-height:1.45;color:var(--quiet)}
.proof{display:flex;flex-direction:column;justify-content:center;gap:18px}
.proof-label{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.12em;color:var(--quiet)}
.strip{display:flex;align-items:center;justify-content:space-between;gap:4px}
.strip button{padding:0;background:transparent;border:0;min-width:0}
.strip img{display:block;object-fit:contain;width:32px;height:32px}
.proof hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}
.compare{display:flex;align-items:center;justify-content:space-around;gap:6px}
.compare img{display:block;object-fit:contain}
.size{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10px;color:var(--quiet)}
.picker{width:100%;border:1px solid var(--line);background:var(--surface-hover);color:var(--ink);padding:6px 8px;border-radius:7px;font:inherit;font-size:12px}
dialog{max-width:calc(100% - 24px);width:460px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 20px 80px #0008}
dialog::backdrop{background:#0009}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-top strong{font-size:16px}
.close{background:var(--surface-hover);border:1px solid var(--line);color:var(--ink);padding:6px 11px;border-radius:8px;font-size:12px}
#large{display:block;width:100%;aspect-ratio:1;object-fit:contain;margin:12px 0}
#detail{margin:0;font-size:13px;line-height:1.5;color:var(--quiet)}
body.light{--surface:#f3f0ea;--surface-hover:#e7e3db;--ink:#25292d;--quiet:#686c70;--line:#d5d1ca}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:16px}.art img{max-width:136px}.name{font-size:13px;gap:5px}.note{font-size:11px}.proof{gap:12px}.strip{flex-wrap:wrap;justify-content:center;gap:8px}.compare{gap:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="toolbar" aria-label="Icon backdrop">
<button data-mode="dark" aria-pressed="true">Dark</button><button data-mode="light" aria-pressed="false">Light</button>
</div>
<div class="grid">
<section class="card">
<button class="art" data-id="otter" aria-label="Enlarge A Pocket Otter"><img src="a-pocket-otter.png" alt="Chestnut otter holding a pebble on an ink teal tile"></button>
<div class="name"><span class="letter">A</span>Pocket Otter</div><p class="note">A calm companion. Matte sculpture.</p>
</section>
<section class="card">
<button class="art" data-id="switch" aria-label="Enlarge B Switch"><img src="b-switch.png" alt="Large red sculptural switch on warm ivory ceramic"></button>
<div class="name"><span class="letter">B</span>Switch</div><p class="note">One bold control. Red lacquer.</p>
</section>
<section class="card">
<button class="art" data-id="portal" aria-label="Enlarge C Smoke Portal"><img src="c-smoke-portal.png" alt="Dark smoky glass tile with an offset amber-lit aperture"></button>
<div class="name"><span class="letter">C</span>Smoke Portal</div><p class="note">An entrance. Smoked glass.</p>
</section>
<section class="card">
<button class="art" data-id="deck" aria-label="Enlarge D Ollie Deck"><img src="d-ollie-deck.png" alt="Black skateboard rising diagonally over a sky blue tile"></button>
<div class="name"><span class="letter">D</span>Ollie Deck</div><p class="note">The name, in motion. Graphic print.</p>
</section>
<section class="card">
<button class="art" data-id="shift" aria-label="Enlarge E Shift"><img src="e-shift.png" alt="Two stepped cobalt blue slabs with a diagonal cut on cream"></button>
<div class="name"><span class="letter">E</span>Shift</div><p class="note">A precise step. Cobalt acrylic.</p>
</section>
<section class="card proof" aria-label="Small icon comparison">
<div class="proof-label">32 px</div>
<div class="strip">
<button data-id="otter" aria-label="Enlarge Pocket Otter"><img data-source="a-pocket-otter.png" alt="A at 32 pixels"></button>
<button data-id="switch" aria-label="Enlarge Switch"><img data-source="b-switch.png" alt="B at 32 pixels"></button>
<button data-id="portal" aria-label="Enlarge Smoke Portal"><img data-source="c-smoke-portal.png" alt="C at 32 pixels"></button>
<button data-id="deck" aria-label="Enlarge Ollie Deck"><img data-source="d-ollie-deck.png" alt="D at 32 pixels"></button>
<button data-id="shift" aria-label="Enlarge Shift"><img data-source="e-shift.png" alt="E at 32 pixels"></button>
</div>
<hr>
<select class="picker" aria-label="Choose icon for size comparison">
<option value="otter">A · Pocket Otter</option><option value="switch">B · Switch</option><option value="portal">C · Smoke Portal</option><option value="deck">D · Ollie Deck</option><option value="shift">E · Shift</option>
</select>
<div class="compare">
<div class="size"><img class="sizing" data-source="a-pocket-otter.png" alt="Selected icon at 16 pixels" width="16" height="16">16</div>
<div class="size"><img class="sizing" data-source="a-pocket-otter.png" alt="Selected icon at 32 pixels" width="32" height="32">32</div>
<div class="size"><img class="sizing" data-size="64" data-source="a-pocket-otter.png" alt="Selected icon at 64 pixels" width="64" height="64">64</div>
</div>
</section>
</div>
<dialog aria-labelledby="modal-title">
<div class="modal-top"><strong id="modal-title"></strong><button class="close">Close</button></div>
<img id="large" alt=""><p id="detail"></p>
</dialog>
<script>
const info={
otter:{name:"A · Pocket Otter",detail:"Most characterful. Opus's preferred direction. A recognizable face gives Ollie its own personality."},
switch:{name:"B · Switch",detail:"Most tactile. A single physical control feels direct and useful. Its large red shape stays strong at small sizes."},
portal:{name:"C · Smoke Portal",detail:"Closest to the current glass interface. The off-centre aperture gives it an O-like form; contrast is deliberately subdued."},
deck:{name:"D · Ollie Deck",detail:"Most playful. A literal ollie jump makes the name visual. More expressive, with a less obvious productivity connection."},
shift:{name:"E · Shift",detail:"Strongest graphic direction. A crisp stepped silhouette, saturated cobalt, and fewer small details."}
};
const dialog=document.querySelector("dialog");
const sources=Object.fromEntries([...document.querySelectorAll(".art")].map(b=>[b.dataset.id,b.querySelector("img").getAttribute("src")]));
const files={otter:"a-pocket-otter.png",switch:"b-switch.png",portal:"c-smoke-portal.png",deck:"d-ollie-deck.png",shift:"e-shift.png"};
document.querySelectorAll("[data-source]").forEach(i=>{i.src=sources[Object.keys(files).find(k=>files[k]===i.dataset.source)]});
function show(id){document.querySelector("#modal-title").textContent=info[id].name;document.querySelector("#detail").textContent=info[id].detail;const img=document.querySelector("#large");img.src=sources[id];img.alt=info[id].name;dialog.showModal()}
document.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
document.querySelector(".close").addEventListener("click",()=>dialog.close());
dialog.addEventListener("click",e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{document.body.classList.toggle("light",b.dataset.mode==="light");document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));
document.querySelector(".picker").addEventListener("change",e=>document.querySelectorAll(".sizing").forEach(i=>i.src=sources[e.target.value]));
Promise.all([...document.images].filter(i=>i.id!=="large").map(i=>i.decode())).then(()=>console.log(JSON.stringify({loadedImages:[...document.images].filter(i=>i.id!=="large").length,horizontalOverflow:document.documentElement.scrollWidth>innerWidth,choices:Object.keys(info).length})));
</script></body></html>
