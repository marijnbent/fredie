<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;background:transparent;color:var(--foreground,#e8eaed);font-family:var(--font-sans,system-ui,sans-serif)}
*{box-sizing:border-box}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--ring,#a3bfd1);outline-offset:3px}
svg{display:block}svg [fill="#000"]{fill:currentColor}svg [stroke="#000"]{stroke:currentColor}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:1px solid var(--border,#384047);border-radius:var(--radius,12px);background:var(--secondary,#20272d);color:inherit;padding:20px 16px 16px;text-align:left;min-width:0}.option[aria-pressed="true"]{border-color:var(--accent,#8ea8b9);box-shadow:inset 0 0 0 1px var(--accent,#8ea8b9)}
.art{display:grid;place-items:center;height:121px}.art svg{width:100px;height:100px}.name{display:flex;align-items:baseline;gap:9px;font-weight:600;font-size:13px}.letter{font-weight:500;color:var(--muted-foreground,#a7b0b8)}.tick{margin-left:auto;color:var(--accent,#b7d1e2);font-size:15px;opacity:0}.option[aria-pressed="true"] .tick{opacity:1}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 12px;font-size:12px}.control-group{display:flex;align-items:center;gap:10px}.quiet{color:var(--muted-foreground,#a7b0b8)}.segments{display:flex;gap:2px}.segments button,.current-button{padding:5px 9px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted-foreground,#a7b0b8);font-size:12px}.segments button[aria-pressed="true"],.current-button[aria-pressed="true"]{border-color:var(--border,#384047);background:var(--secondary,#29343c);color:var(--foreground,#fff)}
.contexts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.context{padding:16px;border-radius:var(--radius,12px);overflow:hidden}.dark{background:linear-gradient(105deg,#1d3444,#17242e);color:#f5f7f9}.light{background:linear-gradient(105deg,#e4edf3,#d7e3eb);color:#1e2932}.menubar{height:26px;display:flex;align-items:center;justify-content:flex-end;gap:14px;white-space:nowrap}.selected-mark{display:grid;place-items:center;width:24px;flex:none}.selected-mark svg{width:var(--mark-size,18px);height:var(--mark-size,18px)}.wifi{width:18px;height:18px;flex:none}.battery{width:22px;height:14px;flex:none}.clock{font-size:12px;font-weight:550;font-variant-numeric:tabular-nums}
.selection{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:11px;color:var(--muted-foreground,#a7b0b8)}.selection strong{font-weight:550;color:var(--foreground,#e8eaed)}
@media(max-width:450px){.art{height:112px}.art svg{width:88px;height:88px}.contexts{grid-template-columns:1fr}.option{padding-top:16px}.controls{gap:8px}.control-group{gap:6px}.segments button{padding:5px 7px}.menubar{gap:18px}.selection{font-size:10px}}
</style></head><body>

<script>
const marks={"a-cheeks":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\">\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 11.75C9.45 13.25 10.6 14.25 12.1 14.25C14.15 14.25 15.8 13.2 16.2 11.4C16.45 10.2 16.35 8.95 15.95 7.9C17.05 7.55 16.85 5.75 15.55 6C15.15 5.35 14.55 4.9 13.8 4.65C11.7 3.95 6.3 3.95 4.2 4.65C3.45 4.9 2.85 5.35 2.45 6C1.15 5.75 .95 7.55 2.05 7.9C1.65 8.95 1.55 10.2 1.8 11.4C2.2 13.2 3.85 14.25 5.9 14.25C7.4 14.25 8.55 13.25 9 11.75\"/>\n<path fill=\"#000\" d=\"M7.45 9.35C8.1 9.1 9.9 9.1 10.55 9.35C11.4 9.65 10.95 10.55 10.35 10.95C9.5 11.6 8.5 11.6 7.65 10.95C7.05 10.55 6.6 9.65 7.45 9.35Z\"/>\n<circle fill=\"#000\" cx=\"5.65\" cy=\"7.75\" r=\".8\"/>\n<circle fill=\"#000\" cx=\"12.35\" cy=\"7.75\" r=\".8\"/>\n</svg>\n","b-happy":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 18 18\">\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 11.75C9.45 13.25 10.6 14.25 12.1 14.25C14.15 14.25 15.8 13.2 16.2 11.4C16.45 10.2 16.35 8.95 15.95 7.9C17.05 7.55 16.85 5.75 15.55 6C15.15 5.35 14.55 4.9 13.8 4.65C11.7 3.95 6.3 3.95 4.2 4.65C3.45 4.9 2.85 5.35 2.45 6C1.15 5.75 .95 7.55 2.05 7.9C1.65 8.95 1.55 10.2 1.8 11.4C2.2 13.2 3.85 14.25 5.9 14.25C7.4 14.25 8.55 13.25 9 11.75\"/>\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.15\" stroke-linecap=\"round\" d=\"M4.65 7.9C5.15 7.05 6.15 7.05 6.65 7.9M11.35 7.9C11.85 7.05 12.85 7.05 13.35 7.9\"/>\n<path fill=\"#000\" d=\"M7.45 9.35C8.1 9.1 9.9 9.1 10.55 9.35C11.4 9.65 10.95 10.55 10.35 10.95C9.5 11.6 8.5 11.6 7.65 10.95C7.05 10.55 6.6 9.65 7.45 9.35Z\"/>\n</svg>\n","current":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\">\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 7.3C4 5.8 2.5 6.8 const names={"a-cheeks":"A · Cheeks","b-happy":"B · Happy","current":"Previous · Whiskers"};
let selection="b-happy";
document.querySelectorAll("[data-select]").forEach(button=>button.addEventListener("click",()=>{
selection=button.dataset.select;
document.querySelectorAll("[data-select]").forEach(other=>other.setAttribute("aria-pressed",String(other.dataset.select===selection)));
document.querySelectorAll(".selected-mark").forEach(mark=>mark.innerHTML=marks[selection]);
document.getElementById("selected-name").textContent=names[selection];
}));
document.querySelectorAll("[data-size]").forEach(button=>button.addEventListener("click",()=>{
document.documentElement.style.setProperty("--mark-size",button.dataset.size+"px");
document.querySelectorAll("[data-size]").forEach(other=>other.setAttribute("aria-pressed",String(other===button)));
document.getElementById("size-value").textContent=button.dataset.size;
}));
const chooseB=document.querySelector('[data-select="b-happy"]');
chooseB.click();
console.assert(document.getElementById("selected-name").textContent==="B · Happy","selection updates");
document.querySelector('[data-size="16"]').click();
console.assert(document.getElementById("size-value").textContent==="16","size updates");
document.querySelector('[data-select="current"]').click();
console.assert(document.querySelector(".selected-mark").innerHTML.includes('viewBox="0 0 24 24"'),"current reference updates");
document.querySelector('[data-size="18"]').click();
document.querySelector('[data-select="b-happy"]').click();
</script></body></html>
