<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--surface:#22282e;--surface-hover:#2b333c;--ink:#f2f3f4;--quiet:#a5b0ba;--line:#3d4852;--selected:#9eafc5;--radius:14px}
html,body{margin:0;background:transparent;color:var(--foreground,#f4f4f5);font-family:var(--font-sans,system-ui,sans-serif)}*{box-sizing:border-box}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #7f9dce;outline-offset:3px}svg [fill="#000"]{fill:currentColor}svg [stroke="#000"]{stroke:currentColor}
.toolbar{display:flex;justify-content:flex-end;gap:5px;margin-bottom:12px}.toolbar button{border:1px solid var(--border,var(--line));border-radius:7px;padding:5px 9px;background:transparent;color:var(--foreground,#fff);font-size:12px}.toolbar button[aria-pressed="true"]{background:var(--secondary,#333)}
h2{font-size:13px;font-weight:650;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:16px;min-width:0}.card.selected{border-color:var(--selected);box-shadow:inset 0 0 0 1px var(--selected)}
.choose{display:block;width:100%;padding:0;background:transparent;border:0;color:inherit;text-align:left;border-radius:7px}.app-art{display:block;width:100%;max-width:144px;aspect-ratio:1;object-fit:contain;margin:0 auto 14px}.name{display:flex;gap:6px;align-items:baseline;line-height:1.4;font-size:13px;font-weight:650;white-space:nowrap}.key{color:var(--quiet);font-size:11px;font-weight:500}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:12px}.thumb{display:block;width:32px;height:32px;object-fit:contain}.expand{border:0;background:transparent;color:var(--quiet);font-size:11px;padding:4px 0 4px 7px}.mark-large{height:77px;display:grid;place-items:center;margin-bottom:12px}.mark-large svg{width:66px;height:66px}section+section{margin-top:24px}
.samples{display:grid;gap:7px;margin-top:13px}.bar{display:flex;align-items:center;justify-content:center;gap:18px;border-radius:6px;padding:8px 10px}.bar svg{width:18px;height:18px;display:block}.bar .tiny{width:16px;height:16px}.dark{background:#151b21;color:#fff}.light{background:#e6ebef;color:#18212a}
.pair{display:flex;align-items:center;gap:24px;border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);color:var(--ink)}.pair-image{width:80px;height:80px;object-fit:contain;flex:none}.pair-right{min-width:0;flex:1}.pair-name{font-size:14px;font-weight:600;margin-bottom:12px}.pair-bar{display:flex;align-items:center;justify-content:flex-end;gap:12px;background:var(--surface-hover);border:1px solid var(--line);border-radius:7px;padding:8px 12px}.pair-bar svg{display:block;width:18px;height:18px}.pair-bar .clock{font-size:11px;color:var(--quiet)}
dialog{width:450px;max-width:calc(100% - 24px);padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px #0007}dialog::backdrop{background:#0008}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:16px}.dialog-top strong{font-size:15px}.dialog-top button{border:1px solid var(--line);background:var(--surface-hover);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:12px}.detail-art{display:grid;place-items:center;padding:16px 0}.detail-art img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
body.light{--surface:#f1efeb;--surface-hover:#e5e2dc;--ink:#262b30;--quiet:#69737d;--line:#d5d5d3;--selected:#596b87}
@media(max-width:570px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.name{font-size:12px}.card{padding:16px}.pair{gap:16px}.pair-image{width:64px;height:64px}.pair-name{font-size:12px}.mark-large{height:65px}}

<script>
const apps=[{"id":"happy","key":"A","name":"Happy Pocket","file":"a-happy.png"},{"id":"sleek","key":"B","name":"Sleek","file":"b-sleek.png"},{"id":"floating","key":"C","name":"Floating","file":"c-floating.png"},{"id":"current","key":"","name":"Current","file":"current.png"}];
const marks=[{"id":"whiskers","name":"Whiskers","key":"1","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\">\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 7.3C4 5.8 2.5 6.8 3.4 8.7C1.8 10.4 2.6 13.8 5 15.3C8.8 17.7 15.2 17.7 19 15.3C21.4 13.8 22.2 10.4 20.6 8.7C21.5 6.8 20 5.8 19 7.3C16 5 8 5 5 7.3Z\"/>\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" stroke-linecap=\"round\" d=\"M12 12.6V13.2C10.8 15.6 8.6 15.7 7.8 14.4M12 13.2C13.2 15.6 15.4 15.7 16.2 14.4M1 12L5.8 12.5M18.2 12.5L23 12\"/>\n<circle fill=\"#000\" cx=\"7.8\" cy=\"9.9\" r=\"1\"/><circle fill=\"#000\" cx=\"16.2\" cy=\"9.9\" r=\"1\"/>\n<path fill=\"#000\" d=\"M10.4 11.3C11.4 10.9 12.6 10.9 13.6 11.3C14.1 11.7 13.1 12.8 12 12.8C10.9 12.8 9.9 11.7 10.4 11.3Z\"/>\n</svg>\n"},{"id":"smile","name":"Little Smile","key":"2","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\">\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.8\" stroke-linecap=\"round\" d=\"M6.3 8Q8.4 5.6 10.5 8M13.5 8Q15.6 5.6 17.7 8\"/>\n<ellipse fill=\"#000\" cx=\"12\" cy=\"10.9\" rx=\"2.5\" ry=\"1.4\"/>\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.7\" stroke-linecap=\"round\" d=\"M12 12.1C10.8 15 6.2 15.4 5.5 12.8M12 12.1C13.2 15 17.8 15.4 18.5 12.8M1.8 11.4L5.8 12.4M18.2 12.4L22.2 11.4\"/>\n</svg>\n"},{"id":"peek","name":"Peek","key":"3","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\">\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M8 16.7V14.3C4.2 14 3.6 10.2 5.3 8.1C4.2 6.1 6.1 4.6 7.7 6C10.3 5 12.2 6.4 13.4 8H17C19.5 8 20 10.4 17.5 11.1L14.2 11.6C14.4 14 12.8 15.1 12.8 16.7\"/>\n<circle fill=\"#000\" cx=\"10.7\" cy=\"8.9\" r=\".9\"/><ellipse fill=\"#000\" cx=\"18.8\" cy=\"8.9\" rx=\"1.1\" ry=\"1\"/>\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.4\" stroke-linecap=\"round\" d=\"M16.7 10.1L21.3 9.5M16.7 10.7L21.3 12.1\"/>\n<path fill=\"none\" stroke=\"#000\" stroke-width=\"1.7\" stroke-linecap=\"round\" d=\"M2 19C4 17.5 6 17.5 8 19S12 20.5 14 19S18 17.5 22 19\"/>\n</svg>\n"},{"id":"curl","name":"Curl","key":"4","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\">\n<path fill=\"#000\" d=\"M8 6.5C4.5 7.5 2.7 11.1 3.8 15.1C5 19.6 10.4 21.6 15 20.3C19.1 19.2 21 15.9 19.9 12.6C19.1 10.4 16.2 10.1 15.8 12.1C18.4 12.4 18.5 15.9 15.8 17.4C12.6 19.2 8.5 18 7.1 15.4C5.8 13 6.5 10.8 8.5 9.7Z\"/>\n<path fill=\"#000\" fill-rule=\"evenodd\" d=\"M7.3 3.9C5.8 3.1 4.9 4.4 5.7 5.5C4.1 7.9 5.9 10.6 10 10.9C14.1 11.2 16.2 8.9 15.2 6.3C15.9 4.9 14.4 4.1 13.4 5C11.8 3.8 9.5 3.4 7.3 3.9ZM8.6 7a.65.65 0 1 0-1.3 0a.65.65 0 1 0 1.3 0Zm4.2.5a.65.65 0 1 0-1.3 0a.65.65 0 1 0 1.3 0ZM8 8.5C7.8 10.3 12.2 10.5 12.5 8.8C11.6 7.6 9.1 7.4 8 8.5Z\"/>\n<ellipse fill=\"#000\" cx=\"10.3\" cy=\"8.8\" rx=\"1.05\" ry=\".65\"/>\n</svg>\n"}];
const appSources=Object.fromEntries([...document.querySelectorAll(".app-card")].map(c=>[c.dataset.app,c.querySelector(".app-art").getAttribute("src")]));
let app="happy",mark="whiskers";
const dialog=document.querySelector("dialog");
function update(){
const a=apps.find(x=>x.id===app),m=marks.find(x=>x.id===mark);
document.querySelectorAll(".app-card").forEach(c=>{const active=c.dataset.app===app;c.classList.toggle("selected",active);c.querySelector(".choose").setAttribute("aria-pressed",String(active))});
document.querySelectorAll(".menu-card").forEach(c=>{const active=c.dataset.menu===mark;c.classList.toggle("selected",active);c.querySelector(".choose").setAttribute("aria-pressed",String(active))});
document.querySelector(".pair-image").src=appSources[app];
document.querySelector(".pair-image").alt=a.name;
document.querySelector(".pair-mark").innerHTML=m.svg;
document.querySelector(".pair-name").textContent=(a.key||"Current")+" + "+m.key+" · "+a.name+" / "+m.name;
}
document.querySelectorAll("[data-choose-app]").forEach(b=>b.addEventListener("click",()=>{app=b.dataset.chooseApp;update()}));
document.querySelectorAll("[data-choose-menu]").forEach(b=>b.addEventListener("click",()=>{mark=b.dataset.chooseMenu;update()}));
document.querySelectorAll("[data-thumb]").forEach(i=>i.src=appSources[i.dataset.thumb]);
document.querySelectorAll("[data-enlarge-app]").forEach(b=>b.addEventListener("click",()=>{const a=apps.find(x=>x.id===b.dataset.enlargeApp);document.querySelector("#detail-title").textContent=a.name;const holder=document.querySelector(".detail-art");holder.replaceChildren();const img=document.createElement("img");img.src=appSources[a.id];img.alt=a.name;holder.append(img);dialog.showModal()}));
document.querySelector(".close").addEventListener("click",()=>dialog.close());
dialog.addEventListener("click",e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.querySelectorAll("[data-theme]").forEach(b=>b.addEventListener("click",()=>{document.body.classList.toggle("light",b.dataset.theme==="light");document.querySelectorAll("[data-theme]").forEach(t=>t.setAttribute("aria-pressed",String(t===b)))}));
update();
Promise.all([...document.images].map(i=>i.decode())).then(()=>console.log(JSON.stringify({images:document.images.length,overflow:document.documentElement.scrollWidth>innerWidth,apps:apps.length,marks:marks.length})));
</script></body></html>
