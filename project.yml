name: Fredie
options:
  bundleIdPrefix: nl.bentjes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "X44F5HTS6P"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_STRICT_CONCURRENCY: complete
    FREDIE_BUNDLE_IDENTIFIER: nl.bentjes.fredie
  configs:
    Debug:
      FREDIE_BUNDLE_IDENTIFIER: nl.bentjes.fredie.dev
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Fredie:
    type: application
    platform: macOS
    sources:
      - path: Fredie
        excludes:
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Fredie/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(FREDIE_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Fredie/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fredie/Fredie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: fredie
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_NAME: Fredie Dev
